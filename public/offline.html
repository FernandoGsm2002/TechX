<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — TechX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    .icon { font-size: 3rem; }
    h1 { font-size: 1.25rem; font-weight: 700; }
    p  { font-size: 0.875rem; color: #94a3b8; text-align: center; max-width: 280px; }
    button {
      margin-top: 8px;
      padding: 10px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <span class="icon">📡</span>
  <h1>Sin conexión</h1>
  <p>Verifica tu conexión a internet e intenta de nuevo.</p>
  <button onclick="window.location.reload()">Reintentar</button>
</body>
</html>
